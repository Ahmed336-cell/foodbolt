<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join FoodRush</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #141830;
      background: #fff8f0;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(100%, 460px);
      padding: 28px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 18px 60px rgba(20, 24, 48, 0.12);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 8px 0; color: #666; line-height: 1.5; }
    .code {
      margin: 20px 0;
      padding: 14px 18px;
      border-radius: 16px;
      background: #fff3e6;
      color: #e85d04;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }
    .actions { display: grid; gap: 10px; margin-top: 18px; }
    a, button {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 0;
      box-sizing: border-box;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    .primary { background: #e85d04; color: white; }
    .secondary { background: #fff3e6; color: #e85d04; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <section class="card" id="join-card">
      <h1>Join FoodRush</h1>
      <p>Opening the app...</p>
      <div class="code hidden" id="code"></div>
      <div class="actions hidden" id="actions">
        <a class="primary" id="open-app" href="#">Open FoodRush</a>
        <button class="secondary" id="copy-code" type="button">Copy room code</button>
      </div>
    </section>
  </main>

  <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const joinIndex = pathParts.findIndex((part) => part.toLowerCase() === 'join');
    const token = joinIndex >= 0 ? pathParts[joinIndex + 1] : null;

    const card = document.getElementById('join-card');
    const code = document.getElementById('code');
    const actions = document.getElementById('actions');
    const openApp = document.getElementById('open-app');
    const copyCode = document.getElementById('copy-code');

    if (!token) {
      card.innerHTML = '<h1>Page not found</h1><p>This FoodRush link is invalid.</p><div class="actions"><a class="primary" href="/">Go home</a></div>';
    } else {
      const safeToken = decodeURIComponent(token);
      const appUrl = `foodrush://join/${encodeURIComponent(safeToken)}`;
      code.textContent = safeToken;
      code.classList.remove('hidden');
      actions.classList.remove('hidden');
      openApp.href = appUrl;
      copyCode.addEventListener('click', async () => {
        await navigator.clipboard.writeText(safeToken);
        copyCode.textContent = 'Copied';
      });
      setTimeout(() => {
        window.location.href = appUrl;
      }, 400);
    }
  </script>
</body>
</html>
