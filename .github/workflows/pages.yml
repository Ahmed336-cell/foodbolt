name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write public Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            python3 -c "import json,os; from pathlib import Path; Path('docs/supabase-config.js').write_text('// Generated by GitHub Actions\nwindow.FOODRUSH_SUPABASE = '+json.dumps({'url':os.environ['SUPABASE_URL'],'anonKey':os.environ['SUPABASE_ANON_KEY']})+';\n')"
            echo "Wrote docs/supabase-config.js from secrets"
          elif [ ! -f docs/supabase-config.js ]; then
            echo "Missing docs/supabase-config.js and secrets SUPABASE_URL / SUPABASE_ANON_KEY"
            exit 1
          else
            echo "Using committed docs/supabase-config.js"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
